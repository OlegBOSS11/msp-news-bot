[pytest]
# Silences: "PytestDeprecationWarning: The configuration option
# 'asyncio_default_fixture_loop_scope' is unset." — every test already
# marks itself explicitly with @pytest.mark.asyncio (strict mode, the
# default, left untouched here), this only pins the fixture loop scope
# that was already the de facto behavior.
asyncio_default_fixture_loop_scope = function
