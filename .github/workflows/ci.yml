name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # See CONTRIBUTING.md / DEPLOY.md — sgmllib3k (feedparser dep)
          # needs an older setuptools + no build isolation on newer pip.
          pip install "setuptools==68.2.2" wheel
          pip install --no-build-isolation -r requirements.txt
          pip install --no-build-isolation -r requirements-dev.txt
          pip install ruff

      - name: Lint (ruff check)
        run: ruff check .

      # ruff format --check is intentionally not run yet — the existing
      # codebase predates ruff and needs one dedicated reformatting pass
      # (see DEPLOY.md/CONTRIBUTING.md history) rather than folding it
      # silently into an unrelated change.

      - name: Run tests
        env:
          BOT_TOKEN: "123456:test-token"
          CHAT_ID: "123456"
          GIGACHAT_CREDENTIALS: "test:cred"
        run: python -m pytest -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production (EU VPS) over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /root/msp-news-bot
            git fetch origin main
            git reset --hard origin/main
            source venv/bin/activate
            pip install --no-build-isolation -r requirements.txt
            systemctl restart msp-news-bot
            sleep 3
            systemctl is-active --quiet msp-news-bot
